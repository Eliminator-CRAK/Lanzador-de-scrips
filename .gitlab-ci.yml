# (Autor: Alex Roman)
# Descripcion: Analisis continuo de alta sensibilidad con Semgrep.

stages:
  - validate
  - security

build-release:
  stage: validate
  image: mcr.microsoft.com/dotnet/sdk:10.0.203@sha256:8a90a473da5205a16979de99d2fc20975e922c68304f5c79d564e666dc3982fc
  interruptible: true
  timeout: 30m
  variables:
    EnableWindowsTargeting: "true"
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  script:
    - dotnet restore LanzadorScripts.csproj -p:EnableWindowsTargeting=true
    - dotnet build LanzadorScripts.csproj -c Release --no-restore -p:EnableWindowsTargeting=true
  cache: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: "$CI_MERGE_REQUEST_IID"
    - if: '$CI_PIPELINE_SOURCE == "push"'

nuget-audit:
  stage: validate
  image: mcr.microsoft.com/dotnet/sdk:10.0.203@sha256:8a90a473da5205a16979de99d2fc20975e922c68304f5c79d564e666dc3982fc
  interruptible: true
  timeout: 20m
  variables:
    EnableWindowsTargeting: "true"
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  script:
    - dotnet restore Pruebas/LanzadorScripts.Pruebas.csproj -p:EnableWindowsTargeting=true
    - dotnet list Pruebas/LanzadorScripts.Pruebas.csproj package --vulnerable --include-transitive --no-restore
  cache: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: "$CI_MERGE_REQUEST_IID"
    - if: '$CI_PIPELINE_SOURCE == "push"'

semgrep-high-sensitivity:
  stage: security
  image: semgrep/semgrep@sha256:98c2572fced2474539fd27cab3207ebd8e95e4e7aab4c3b381fdc5e2641d9941
  interruptible: true
  timeout: 60m
  variables:
    GIT_DEPTH: "0"
  script:
    - sh Herramientas/EjecutarSemgrepEstricto.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: "$CI_MERGE_REQUEST_IID"
    - if: '$CI_PIPELINE_SOURCE == "push"'

gitleaks-history:
  stage: security
  image:
    name: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
    entrypoint: [""]
  interruptible: true
  timeout: 60m
  variables:
    GIT_DEPTH: "0"
  script:
    - >-
      gitleaks git
      --redact=100
      --verbose
      --ignore-gitleaks-allow
      --max-archive-depth 5
      --max-decode-depth 10
      --max-target-megabytes 0
      --log-opts="--all --full-history"
      .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: "$CI_MERGE_REQUEST_IID"
    - if: '$CI_PIPELINE_SOURCE == "push"'
