# (Autor: Alex Roman)
# Descripcion: Analisis continuo de alta sensibilidad con Semgrep.

stages:
  - security

semgrep-high-sensitivity:
  stage: security
  image: semgrep/semgrep@sha256:98c2572fced2474539fd27cab3207ebd8e95e4e7aab4c3b381fdc5e2641d9941
  interruptible: true
  timeout: 60m
  variables:
    GIT_DEPTH: "0"
  script:
    - >-
      semgrep scan
      --config auto
      --config p/security-audit
      --config p/secrets
      --error
      --strict
      --disable-nosem
      --no-git-ignore
      --timeout 60
      --timeout-threshold 0
      --max-target-bytes 0
      --verbose
      .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: "$CI_MERGE_REQUEST_IID"
    - if: '$CI_PIPELINE_SOURCE == "push"'

gitleaks-history:
  stage: security
  image:
    name: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
    entrypoint: [""]
  interruptible: true
  timeout: 60m
  variables:
    GIT_DEPTH: "0"
  script:
    - >-
      gitleaks git
      --redact=100
      --verbose
      --ignore-gitleaks-allow
      --max-archive-depth 5
      --max-decode-depth 10
      --max-target-megabytes 0
      --log-opts="--all --full-history"
      .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: "$CI_MERGE_REQUEST_IID"
    - if: '$CI_PIPELINE_SOURCE == "push"'
