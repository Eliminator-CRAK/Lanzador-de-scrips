# (Autor: Alex Roman)
# Descripcion: CI de build, pruebas y publicacion verificable.

name: LanzadorScripts CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup PowerShell 7.6
        shell: powershell
        run: ./Herramientas/EjecutarEtapaCi.ps1 -Etapa PrepararPowerShell

      - name: Restore
        run: dotnet restore .\Pruebas\LanzadorScripts.Pruebas.csproj

      - name: Build Release
        run: dotnet build .\LanzadorScripts.slnx -c Release --no-restore

      - name: Test
        run: dotnet test .\Pruebas\LanzadorScripts.Pruebas.csproj -c Release --no-build

      - name: Audit NuGet packages
        run: dotnet list .\LanzadorScripts.slnx package --vulnerable --include-transitive

      - name: Verify Visual C++ x64
        shell: powershell
        run: ./Herramientas/EjecutarEtapaCi.ps1 -Etapa VerificarCpp

      - name: Publish x64
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_BUILD: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'true' || 'false' }}
        run: ./Herramientas/EjecutarEtapaCi.ps1 -Etapa Publicar

      - name: Verify artifact
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_BUILD: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'true' || 'false' }}
        run: ./Herramientas/EjecutarEtapaCi.ps1 -Etapa VerificarArtefacto
