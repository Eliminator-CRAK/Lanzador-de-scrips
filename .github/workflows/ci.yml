# (Autor: Alex Roman)
# Descripcion: Compila y prueba WPF en Windows alojado sin certificados privados.

name: LanzadorScripts CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-windows:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Verify .NET SDK
        shell: powershell
        run: ./Herramientas/EjecutarEtapaCi.ps1 -Etapa VerificarDotnet

      - name: Restore
        shell: powershell
        run: |
          dotnet restore .\Pruebas\LanzadorScripts.Pruebas.csproj
          dotnet restore .\Servidor\LanzadorScripts.Servidor.Servicio\LanzadorScripts.Servidor.Servicio.csproj
          dotnet restore .\Servidor\LanzadorScripts.Servidor.Administracion\LanzadorScripts.Servidor.Administracion.csproj

      - name: Build Release
        shell: powershell
        run: |
          dotnet build .\LanzadorScripts.csproj -c Release --no-restore
          dotnet build .\Servidor\LanzadorScripts.Servidor.Servicio\LanzadorScripts.Servidor.Servicio.csproj -c Release --no-restore
          dotnet build .\Servidor\LanzadorScripts.Servidor.Administracion\LanzadorScripts.Servidor.Administracion.csproj -c Release --no-restore

      - name: Test
        run: dotnet test .\Pruebas\LanzadorScripts.Pruebas.csproj -c Release --no-restore --logger trx --results-directory obj\ResultadosCi

      - name: Audit NuGet packages
        shell: powershell
        run: |
          dotnet list .\Pruebas\LanzadorScripts.Pruebas.csproj package --vulnerable --include-transitive --no-restore
          dotnet list .\EjecutorPowerShell\LanzadorScripts.EjecutorPowerShell.csproj package --vulnerable --include-transitive --no-restore
          dotnet list .\Servidor\LanzadorScripts.Servidor.Servicio\LanzadorScripts.Servidor.Servicio.csproj package --vulnerable --include-transitive --no-restore
          dotnet list .\Servidor\LanzadorScripts.Servidor.Administracion\LanzadorScripts.Servidor.Administracion.csproj package --vulnerable --include-transitive --no-restore

      - name: Verify self-contained native application
        shell: pwsh
        run: ./Herramientas/EjecutarEtapaCi.ps1 -Etapa PublicarValidacionNativa

      # Los MSI y EXE distribuibles se crean y firman en el equipo de publicacion.
      - name: Save test results and WPF screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verificacion-wpf-${{ github.sha }}
          path: |
            obj/ResultadosCi/*.trx
            Pruebas/bin/Release/net10.0-windows/VerificacionVisual/*.png
          if-no-files-found: error
          retention-days: 14
