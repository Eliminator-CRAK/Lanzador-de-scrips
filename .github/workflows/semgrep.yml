# (Autor: Alex Roman)
# Descripcion: Analisis continuo de alta sensibilidad con Semgrep.

name: Semgrep High Sensitivity

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  semgrep-high-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: semgrep/semgrep@sha256:98c2572fced2474539fd27cab3207ebd8e95e4e7aab4c3b381fdc5e2641d9941

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan
        run: sh Herramientas/EjecutarSemgrepEstricto.sh

  gitleaks-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks

      - name: Scan Git history
        shell: bash
        run: |
          "${RUNNER_TEMP}/gitleaks" git \
            --redact=100 \
            --verbose \
            --ignore-gitleaks-allow \
            --max-archive-depth 5 \
            --max-decode-depth 10 \
            --max-target-megabytes 0 \
            --log-opts="--all --full-history" \
            .
